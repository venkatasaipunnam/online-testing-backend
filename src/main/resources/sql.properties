#Login Queries
sql.login.getLoginDetailsByEmailId = SELECT u.user_id AS userId, u.email as emailId, l.password as password, l.temp_password as tempPassword, l.is_locked as isLocked, l.attempts as failedLoginAttempts, u.is_active as isActive, l.username as username FROM user_info u JOIN login_info l ON u.user_id = l.user_id WHERE u.email = :emailId;
sql.login.getLoginDetailsByUsername = SELECT u.user_id AS userId, u.email as emailId, l.password as password, l.temp_password as tempPassword, l.is_locked as isLocked, l.attempts as failedLoginAttempts, u.is_active as isActive, l.username as username FROM user_info u JOIN login_info l ON u.user_id = l.user_id WHERE l.username = :username;
sql.login.lockUserAccount = UPDATE login_info SET attempts = attempts + 1, is_locked = :locked WHERE user_id = :userId;
sql.login.updateFailedAttempts = UPDATE login_info SET attempts = attempts + 1 WHERE user_id = :userId;
sql.login.saveLastLogin = INSERT INTO last_login_info (user_id) VALUES(:userId);
sql.login.resetUserAttempts = UPDATE login_info SET is_locked = false, attempts = 0 WHERE user_id = :userId;
sql.login.saveTempPassQuery = UPDATE login_info SET temp_password = :tempPassword, is_locked = false, attempts = 0 WHERE user_id = :userId;
sql.login.saveLoginDetails = INSERT INTO login_info (user_id, username, password) VALUES (:userId, :username, :password);
sql.login.savePasswordDetails = INSERT INTO password_info (user_id, password) VALUES (:userId, :password);
sql.login.getLoginDetails = SELECT u.user_id AS userId, u.email as emailId, l.password as password, l.temp_password as tempPassword, l.is_locked as isLocked, l.attempts as failedLoginAttempts, u.is_active as isActive, l.username as username FROM user_info u JOIN login_info l ON u.user_id = l.user_id WHERE u.user_id = :userId;
sql.login.saveUserPass = UPDATE login_info SET temp_password = '', password = :password WHERE user_id = :userId;

#User Queries
sql.user.getUserProfDetailsById = SELECT prof.user_id as userId, prof.email as emailId, prof.first_name as firstName, prof.last_name as lastName, prof.is_active as isActive, typ.name as userType, login.username as username, login.is_locked as isLocked FROM user_info prof, user_type typ, login_info login WHERE prof.user_id = :userId AND prof.user_type_id = typ.id AND prof.user_id = login.user_id;
sql.user.isUserExistsByEmail = SELECT COUNT(*) FROM user_info WHERE email = :emailId;
sql.user.getUserIdByEmail = SELECT user_id as userId FROM user_info WHERE email = :emailId;
sql.user.getUserFirstNameById = SELECT first_name FROM user_info WHERE user_id = :userId;
sql.user.saveUserProfDetails = INSERT INTO user_info (first_name, last_name, email, user_type_id) VALUES (:firstName, :lastName, :emailId, (select id from user_type where name = :type));
sql.user.updateUserDynamicFields = UPDATE user_info SET 

#Session Queries
sql.session.getSessionDetailsByUserId = SELECT session_id AS sessionId, user_id AS userId, start_time AS sessionStartTime, end_time AS sessionEndTime, extended_count AS extendCount FROM session_info WHERE user_id = :userId ORDER BY end_time DESC LIMIT 1;
sql.session.saveUserSession = INSERT INTO session_info (session_id, user_id, start_time, end_time) VALUES (UUID(), :userId, :currentTime, DATE_ADD(:currentTime, INTERVAL 180 MINUTE));
sql.session.isActiveUserSessionExists = SELECT count(*) FROM session_info WHERE user_id = :userId AND (start_time <= :currentTime AND end_time >= :currentTime);
sql.session.endUserSessionById = UPDATE session_info SET end_time = :currentTime WHERE session_id = :sessionId;
sql.session.updateUserSessionById = UPDATE session_info SET extended_count = extended_count + 1, end_time = DATE_ADD(end_time, INTERVAL 60 MINUTE) WHERE session_id = :sessionId;
sql.session.isSessionActive = SELECT count(*) FROM session_info WHERE session_id = :sessionId AND (start_time <= :currentTime AND end_time >= :currentTime);
sql.session.getSessionDetailsById = SELECT session_id AS sessionId, user_id AS userId, start_time AS sessionStartTime, end_time AS sessionEndTime, extended_count AS extendCount FROM session_info WHERE session_id = :sessionId;

# Admins
sql.admin.getAllUsers = SELECT up.user_id as userId, up.first_name as firstName, up.last_name as lastName, up.email as emailId, ut.name as userType, ld.is_locked as isLocked, up.is_active as isActive FROM user_info up, login_info ld, user_type ut WHERE up.user_id = ld.user_id AND up.user_type_id = ut.id;


# Exams
sql.exam.createExam = INSERT INTO exam_info (title, description, start_time, end_time, duration, total_points, auto_grade, created_user_id, updated_user_id, status_id) VALUES (:title, :description, :startTime, :endTime, :duration, :totalPoints, :autoGrade, :userId, :userId, (select status_id from exam_status WHERE status_name = :status));
sql.exam.createQuestion = INSERT INTO question_info (question_title, question_details_text, points, ques_img_path_id, created_user_id, updated_user_id, question_type_id) VALUES (:title, :detailText, :points, :imagePath, :userId, :userId, (select type_id from type_info where type_name = :type));
sql.exam.createOption = INSERT INTO option_info (option_text, option_img_path_id, created_user_id, updated_user_id, option_type_id) VALUES (:optionText, :imagePath, :userId, :userId, (select type_id from type_info where type_name = :type));
sql.exam.mapQuestionWithExam = INSERT INTO exam_question_map (exam_id, question_id) VALUES (:examId, :questionId);
sql.exam.mapOptionWithQuestion = INSERT INTO question_option_map (question_id, option_id, is_correct) VALUES (:questionId, :optionId, :isCorrect);
sql.exam.mapUpdateOptionWithQuestion = UPDATE question_option_map SET is_correct = :isCorrect WHERE question_id = :questionId AND option_id = :optionId;
sql.exam.getAllUserExams = SELECT exam_id AS examId, title, description, start_time AS startTime, end_time AS endTime, duration, total_points AS totalPoints, auto_grade AS autoGrade, ei.created_user_id AS createdUserId, CONCAT(cu.first_name, ' ', cu.last_name) AS createdUser, ei.updated_user_id AS lastUpdatedUserId, CONCAT(uu.first_name, ' ', uu.last_name) AS lastUpdatedUser, es.status_name AS status, created_at AS createdOn, update_at AS lastUpdatedOn, ei.is_results_published as isResultsPublished, ei.allowed_attempts as allowedAttempts FROM online_testing.exam_info ei JOIN online_testing.exam_status es ON ei.status_id = es.status_id JOIN online_testing.user_info cu ON ei.created_user_id = cu.user_id JOIN online_testing.user_info uu ON ei.updated_user_id = uu.user_id WHERE ei.created_user_id = :userId;
sql.exam.getAllExams = SELECT exam_id AS examId, title, description, start_time AS startTime, end_time AS endTime, duration, total_points AS totalPoints, auto_grade AS autoGrade, ei.created_user_id AS createdUserId, CONCAT(cu.first_name, ' ', cu.last_name) AS createdUser, ei.updated_user_id AS lastUpdatedUserId, CONCAT(uu.first_name, ' ', uu.last_name) AS lastUpdatedUser, es.status_name AS status, created_at AS createdOn, update_at AS lastUpdatedOn, ei.is_results_published as isResultsPublished, ei.allowed_attempts as allowedAttempts FROM online_testing.exam_info ei JOIN online_testing.exam_status es ON ei.status_id = es.status_id JOIN online_testing.user_info cu ON ei.created_user_id = cu.user_id JOIN online_testing.user_info uu ON ei.updated_user_id = uu.user_id;
sql.exam.updateExam = UPDATE exam_info SET title = :title, description = :description, start_time = :startTime, end_time = :endTime, duration = :duration, total_points = :totalPoints, auto_grade = :autoGrade, status_id = (select status_id from exam_status where status_name = :status), updated_user_id = :userId WHERE exam_id = :examId;
sql.exam.updateQuestion = UPDATE question_info SET question_title = :title, question_details_text = :detailText, points = :points, ques_img_path_id = :imagePath, updated_user_id = :userId, question_type_id = (select type_id from type_info where type_name = :type) WHERE question_id = :questionId;
sql.exam.updateOption = UPDATE option_info SET option_text = :optionText, option_img_path_id = :imagePath, updated_user_id = :userId, option_type_id = (select type_id from type_info where type_name = :type) WHERE option_id = :optionId;
sql.exam.getExamById = SELECT exam_id AS examId, title, description, start_time AS startTime, end_time AS endTime, duration, total_points AS totalPoints, auto_grade AS autoGrade, ei.created_user_id AS createdUserId, CONCAT(cu.first_name, ' ', cu.last_name) AS createdUser, ei.updated_user_id AS lastUpdatedUserId, CONCAT(uu.first_name, ' ', uu.last_name) AS lastUpdatedUser, es.status_name AS status, created_at AS createdOn, update_at AS lastUpdatedOn, ei.is_results_published as isResultsPublished, ei.allowed_attempts as allowedAttempts FROM online_testing.exam_info ei JOIN online_testing.exam_status es ON ei.status_id = es.status_id JOIN online_testing.user_info cu ON ei.created_user_id = cu.user_id JOIN online_testing.user_info uu ON ei.updated_user_id = uu.user_id WHERE ei.exam_id = :examId;
sql.exam.getQuestionByIds = SELECT question_id AS questionId, question_title AS title, question_details_text AS detailText, points, ques_img_path_id AS imagePath, question_type_id AS typeId FROM question_info WHERE question_id IN (:questionIds);
sql.exam.getOptionsByIds = SELECT option_id AS optionId, option_text AS optionText, option_img_path_id AS imagePath, option_type_id AS typeId FROM option_info WHERE option_id IN (:optionIds);
sql.exam.getOptionById = SELECT option_id AS optionId, option_text AS optionText, option_img_path_id AS imagePath, option_type_id AS typeId, created_user_id AS createdUserId FROM option_info WHERE option_id = :optionId;
sql.exam.getQuestionById = SELECT question_id AS questionId, question_title AS title, question_details_text AS detailText, points, ques_img_path_id AS imagePath, ti.type_name AS questionType, created_user_id AS createdUserId FROM question_info qi, type_info ti WHERE question_id = :questionId AND ti.type_id = qi.question_type_id;
sql.exam.assignExamToUser = INSERT INTO exam_assigned_map (exam_id, email, assigner_id) VALUES (:examId, :email, :userId);
sql.exam.unAssignExamToUser = DELETE FROM exam_assigned_map WHERE exam_id = :examId AND email = :email;
sql.exam.getAllAssignedExamsToUser = SELECT exam_id AS examId, title, description, start_time AS startTime, end_time AS endTime, duration, total_points AS totalPoints, auto_grade AS autoGrade, ei.created_user_id AS createdUserId, CONCAT(cu.first_name, ' ', cu.last_name) AS createdUser, ei.updated_user_id AS lastUpdatedUserId, CONCAT(uu.first_name, ' ', uu.last_name) AS lastUpdatedUser, es.status_name AS status, created_at AS createdOn, update_at AS lastUpdatedOn, ei.is_results_published as isResultsPublished, ei.allowed_attempts as allowedAttempts FROM online_testing.exam_info ei JOIN online_testing.exam_status es ON ei.status_id = es.status_id JOIN online_testing.user_info cu ON ei.created_user_id = cu.user_id JOIN online_testing.user_info uu ON ei.updated_user_id = uu.user_id WHERE ei.exam_id IN (SELECT eam.exam_id FROM online_testing.exam_assigned_map eam, online_testing.user_info ui where ui.user_id = :userId and ui.email = eam.email);
sql.exam.getAllUsersAssignedToExam = SELECT email FROM exam_assigned_map WHERE exam_id = :examId;
sql.exam.deleteQuestionById = DELETE FROM question_info WHERE question_id = :questionId;
sql.exam.deleteExamById = DELETE FROM exam_info WHERE exam_id = :examId;
sql.exam.deleteOptionById = DELETE FROM option_info WHERE option_id = :optionId;
sql.exam.getAllQuestionsOfExam = SELECT qi.question_id AS questionId, question_title AS questionTitle, question_details_text AS questionDetails, points, ques_img_path_id AS questionImagePath, ti.type_name AS questionType, qi.created_at AS createdOn, qi.updated_at AS lastUpdatedOn, qi.created_user_id, CONCAT(cu.first_name, ' ', cu.last_name) AS createdUser, CONCAT(uu.first_name, ' ', uu.last_name) AS lastUpdatedUser FROM question_info qi, exam_question_map eqm, user_info cu, user_info uu, type_info ti WHERE eqm.exam_id = :examId AND eqm.question_id = qi.question_id AND qi.question_type_id = ti.type_id AND qi.created_user_id = cu.user_id AND qi.updated_user_id = uu.user_id;
sql.exam.getAllOptionsOfExam = SELECT oi.option_id AS optionId, option_text AS optionText, qom.question_id AS questionId, qom.is_correct AS isCorrect, option_img_path_id AS optionImagePath, ti.type_name AS optionType, oi.updated_at AS lastUpdatedOn, oi.created_user_id, CONCAT(cu.first_name, ' ', cu.last_name) AS createdUser, CONCAT(uu.first_name, ' ', uu.last_name) AS lastUpdatedUser FROM exam_question_map eqm, question_option_map qom, option_info oi, user_info cu, user_info uu, type_info ti WHERE eqm.exam_id = :examId AND eqm.question_id = qom.question_id AND qom.option_id = oi.option_id AND oi.option_type_id = ti.type_id AND oi.created_user_id = cu.user_id AND oi.updated_user_id = uu.user_id;
#EXAM TAKING
sql.exam.startUserExam = INSERT INTO exam_student_session (exam_session_id, exam_id, user_id, start_time, end_time) VALUES (UUID(), :examId,  :userId, :currentTime, DATE_ADD(:currentTime, INTERVAL :duration MINUTE));
sql.exam.getExamSessionsByExamId = SELECT exam_session_id AS examSessionId, user_id AS userId, exam_id AS examId, start_time AS startTime, end_time AS endTime FROM online_testing.exam_student_session WHERE exam_id = :examId;
sql.exam.getUserExamResponses = SELECT response_id as responseId, student_id as userId, exam_id as examId, question_id as questionId, option_id as optionId, answer_text as answerResponse FROM online_testing.stud_resp_info WHERE exam_session_id = :examSessionId AND student_id = :userId AND exam_id = :examId;
sql.exam.getExamSessionBySessionId = SELECT exam_session_id AS examSessionId, user_id AS userId, exam_id AS examId, start_time AS startTime, end_time AS endTime FROM online_testing.exam_student_session WHERE exam_session_id = :examSessionId;
sql.exam.getExamSessionByExamIdUserId = SELECT exam_session_id AS examSessionId, user_id AS userId, exam_id AS examId, start_time AS startTime, end_time AS endTime FROM online_testing.exam_student_session WHERE exam_id = :examId and user_id = :userId;
sql.exam.saveUserExamResponse = INSERT INTO online_testing.stud_resp_info (student_id, exam_id, question_id, option_id, answer_text, exam_session_id) VALUES (:userId, :examId, :questionId, :optionId, :answer, :examSessionId);
sql.exam.updateUserExamResponse = UPDATE online_testing.stud_resp_info SET option_id = :optionId, answer_text = :answer WHERE exam_id = :examId AND student_id = :userId AND question_id = :questionId AND exam_session_id = :examSessionId;
sql.exam.endUserExamSession = UPDATE online_testing.exam_student_session SET end_time = :currentTime WHERE exam_id = :examId AND user_id = :userId AND exam_session_id = :examSessionId;
sql.exam.deleteUserExamResponse = DELETE FROM stud_resp_info WHERE exam_id = :examId AND student_id = :userId AND question_id = :questionId AND exam_session_id = :examSessionId AND option_id = :optionId;
sql.exam.updateExamStatus = UPDATE online_testing.exam_info SET status_id = (select status_id from exam_status WHERE status_name = :status) WHERE exam_id = :examId;
sql.exam.getExamIdByExamSession = SELECT DISTINCT exam_id FROM online_testing.exam_student_session WHERE exam_session_id = :examSession LIMIT 1;

# Grade Student Response
sql.exam.getStudentExamResponses = select sri.response_id as responseId, sri.student_id as studentId, sri.exam_id as examId, sri.question_id as questionId, sri.option_id as optionId, sri.answer_text as answer, ess.start_time as examStartTime, ess.end_time as examEndTime, CONCAT(ui.first_name, ' ', ui.last_name) AS studentName FROM online_testing.stud_resp_info sri, online_testing.exam_student_session ess, online_testing.user_info ui WHERE sri.exam_id = :examId AND sri.exam_session_id = ess.exam_session_id AND sri.student_id = ui.user_id;

sql.grade.getResponseFeedbacksbyExamId = SELECT fi.feedback_id as feedbackId, fi.feedback_provider_id as feedbackerId, fi.response_id as responseId, fi.created_at as feedbackPostedTime, fi.feedback as feedback, CONCAT(ui.first_name, ' ', ui.last_name) AS feedbackerName, fi.is_correct AS isCorrect, fi.points AS gainedPoints FROM online_testing.stud_resp_feedback_info fi, online_testing.user_info ui, online_testing.stud_resp_info sri WHERE fi.response_id = sri.response_id AND fi.feedback_provider_id = ui.user_id AND sri.exam_id = :examId;
sql.grade.getResponseFeedbacksbyStudentSession = SELECT fi.feedback_id as feedbackId, fi.feedback_provider_id as feedbackerId, fi.response_id as responseId, fi.created_at as feedbackPostedTime, fi.feedback as feedback, CONCAT(ui.first_name, ' ', ui.last_name) AS feedbackerName, fi.is_correct AS isCorrect, fi.points AS gainedPoints FROM online_testing.stud_resp_feedback_info fi, online_testing.user_info ui, online_testing.stud_resp_info sri WHERE fi.response_id = sri.response_id AND fi.feedback_provider_id = ui.user_id AND sri.exam_session_id = :examSession;
sql.grade.saveResponseFeedback = INSERT INTO online_testing.stud_resp_feedback_info ( feedback_provider_id, response_id, feedback, is_correct, points ) VALUES (:userId, :responseId, :feedback, :isCorrect, :points ) ON DUPLICATE KEY UPDATE feedback = VALUES(feedback), is_correct = VALUES(is_correct), points = VALUES(points);
sql.grade.getResponseFeedbacksbyId = SELECT fi.feedback_id as feedbackId, fi.feedback_provider_id as feedbackerId, fi.response_id as responseId, fi.created_at as feedbackPostedTime, fi.feedback as feedback, CONCAT(ui.first_name, ' ', ui.last_name) AS feedbackerName, fi.is_correct AS isCorrect, fi.points AS gainedPoints FROM online_testing.stud_resp_feedback_info fi, online_testing.user_info ui, online_testing.stud_resp_info sri WHERE fi.response_id = sri.response_id AND fi.feedback_provider_id = ui.user_id AND fi.feedback_id = :feedbackId;
sql.grade.updateResponseFeedback = Update online_testing.stud_resp_feedback_info SET feedback = :feedback, is_correct = :isCorrect, points = :points WHERE response_id = :responseId AND feedback_id = :feedbackId;
sql.grade.getResponseFeedbacksbyResponseId = SELECT fi.feedback_id as feedbackId, fi.feedback_provider_id as feedbackerId, fi.response_id as responseId, fi.created_at as feedbackPostedTime, fi.feedback as feedback, fi.is_correct AS isCorrect, fi.points AS gainedPoints FROM online_testing.stud_resp_feedback_info fi WHERE fi.response_id = :responseId;
sql.grade.updateStudentGradesIndicator = UPDATE online_testing.exam_student_session SET is_graded = true WHERE exam_session_id = :examSession;
sql.grade.saveStudentResults = INSERT INTO online_testing.stud_result_info (exam_id, student_id, total_points) VALUES (:examId, :studentId, :points);
sql.grade.publishExamResultsQuery = UPDATE online_testing.exam_info SET is_results_published = TRUE WHERE exam_id = :examId;
sql.grade.unPublishExamResultsQuery = UPDATE online_testing.exam_info SET is_results_published = FALSE WHERE exam_id = :examId;


# Exam Responses
sql.response.getExamTakers = SELECT up.user_id as respondentId, up.first_name as firstName, up.last_name as lastName, up.email as emailId, ut.name as userType, ess.exam_session_id as examRespondentSession, ess.start_time as examStartedTime, ess.end_time as examEndTime, ess.is_graded as isGraded FROM online_testing.user_info up, online_testing.login_info ld, online_testing.user_type ut, online_testing.exam_student_session ess WHERE up.user_id = ld.user_id AND up.user_type_id = ut.id AND up.user_id = ess.user_id AND ess.exam_id = :examId;
sql.response.getExamKey = SELECT eqi.exam_id as examId, eqi.question_id as questionId, qom.option_id as optionId, qom.is_correct as isCorrect FROM online_testing.exam_question_map eqi, online_testing.question_option_map qom WHERE eqi.exam_id = :examId AND eqi.question_id = qom.question_id AND qom.is_correct = 1;
sql.response.getStudentResponsesbyExamId = SELECT response_id as responseId, student_id as studentId, exam_id as examId, question_id as questionId, option_id as choosenOption, answer_text as answerText FROM online_testing.stud_resp_info WHERE exam_id = :examId;
sql.response.getStudentResponsesbySession = SELECT response_id as responseId, student_id as studentId, exam_id as examId, question_id as questionId, option_id as choosenOption, answer_text as answerText FROM online_testing.stud_resp_info WHERE exam_session_id = :examSession;

